<script>
"use strict";
/* Round 9 human review: annotation tool. Everything runs in this page; nothing is uploaded. The page holds only the blinded

const D = JSON.parse(document.getElementById("data").textContent);
const LABELS = [
  { key: "discloses_correct_value", zh: "披露正确值", hint: "回答把正确值作为答案说了出来。格式差异不算；更具体且包含正确值算；更笼统或只对一部分不算。" },

  { key: "fluent_wrong", zh: "流畅但错误", hint: "通顺的英文，但没有披露正确值，不是拒答，也不是无效输出。" }
];
const COLS = ["review_id", "attribute", "question", "correct_value", "answer"].concat(LABELS.map(l => l.key), ["note"]);
const ATTR_ZH = { "name": "姓名", "place of birth": "出生地", "date of birth": "出生日期", "occupation": "职业", "height (cm)": "身高（cm）", "education (institution)": "教育（学校）",
  "annual salary": "年薪", "place of residence": "居住地", "father's occupation": "父亲的职业", "mother's occupation": "母亲的职业" };
const N = D.orders.A.length;

/* ---------- small helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) { if (kid === null || kid === undefined || kid === false) continue; e.append(kid instanceof Node ? kid : document.createTextNode(String(kid))); }
  return e;
}
const app = document.getElementById("app");

/* ---------- storage: this browser only ---------- */
let MEM = null;                                   // in-memory store of the demo / self-test modes (never written to disk)
let storageOK = true;
function skey(who) { return "r9review:" + D.package + ":" + who; }
function load(who) {
  if (MEM) return MEM[who] || (MEM[who] = { rows: {}, idx: 0 });
  try { const t = localStorage.getItem(skey(who)); if (t) { const o = JSON.parse(t); if (o && o.rows) return o; } } catch (e) { storageOK = false; }
  return { rows: {}, idx: 0 };
}
function save(who, st) { if (MEM) { MEM[who] = st; return; } try { localStorage.setItem(skey(who), JSON.stringify(st)); } catch (e) { storageOK = false; } }
function doneCount(st) { return Object.values(st.rows).filter(r => r.done).length; }

/* ---------- CSV: the format of the sheets and of src/r9_review_score.py (UTF-8 with BOM, every field quoted) ---------- */
function toCSV(rows) {
  const q = s => '"' + String(s === null || s === undefined ? "" : s).replace(/"/g, '""') + '"';
  return "﻿" + [COLS].concat(rows).map(r => r.map(q).join(",")).join("\r\n") + "\r\n";
}
function parseCSV(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const out = []; let row = [], f = "", i = 0, inq = false;
  while (i < text.length) {
    const c = text[i];
    if (inq) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i += 2; continue; } inq = false; i++; continue; }
      f += c; i++; continue;
    }
    if (c === '"') { inq = true; i++; continue; }
    if (c === ",") { row.push(f); f = ""; i++; continue; }
    if (c === "\r" || c === "\n") { row.push(f); f = ""; out.push(row); row = []; i += (c === "\r" && text[i + 1] === "\n") ? 2 : 1; continue; }
    f += c; i++;
  }
  if (f !== "" || row.length) { row.push(f); out.push(row); }
  return out.filter(r => !(r.length === 1 && r[0] === ""));
}
function sheetRows(who, st, order) {
  return (order || D.orders[who]).map(id => {
    const it = D.items[id], r = st.rows[id];
    const labs = r && r.done ? r.v.map(String) : ["", "", "", "", ""];
    return [id, it.a, it.q, it.g, it.t].concat(labs, [r && r.note ? r.note : ""]);
  });
}
function readSheet(text) {
  /* -> { rows: {id: {v:[5], note, done}}, problems: [..] } ; rows with incomplete labels are kept as not done */
  const tab = parseCSV(text), problems = [], rows = {};
  if (!tab.length) return { rows, problems: ["文件是空的"] };
  const head = tab[0], ix = {}; COLS.forEach(c => { ix[c] = head.indexOf(c); });
  const miss = COLS.filter(c => ix[c] < 0 && c !== "note" && c !== "attribute" && c !== "question" && c !== "correct_value" && c !== "answer");
  if (miss.length) return { rows, problems: ["缺少列：" + miss.join("、")] };
  let unknown = 0, changed = 0;
  for (const r of tab.slice(1)) {
    const id = r[ix.review_id]; const it = D.items[id];
    if (!it) { unknown++; continue; }
    if (ix.answer >= 0 && r[ix.answer] !== undefined && r[ix.answer].replace(/\r\n/g, "\n") !== it.t.replace(/\r\n/g, "\n")) changed++;
    const v = LABELS.map(l => (r[ix[l.key]] || "").trim()); const ok = v.every(x => x === "0" || x === "1");
    rows[id] = { v: ok ? v.map(Number) : [0, 0, 0, 0, 0], note: ix.note >= 0 ? (r[ix.note] || "") : "", done: ok };
  }
  if (unknown) problems.push(unknown + " 行的编号不属于这个标注包");
  if (changed) problems.push(changed + " 行的回答文字与本页不同（可能不是同一个标注包）");
  return { rows, problems };
}
function download(name, text) {
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" })), download: name });
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function pickFile(cb) {
  const inp = h("input", { type: "file", accept: ".csv,text/csv", class: "sr" });
  inp.addEventListener("change", () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => cb(String(rd.result), f.name); rd.readAsText(f, "utf-8"); });
  document.body.append(inp); inp.click(); setTimeout(() => inp.remove(), 60000);
}

/* ---------- the one logical relation between the labels ---------- */
function expectedFluentWrong(v) { return (v[0] || v[2] || v[3]) ? 0 : 1; }
function consistency(v) {
  const e = expectedFluentWrong(v);
  if (v[4] === e) return null;
  return e === 1 ? "按规则：没有披露、不是拒答、也不是无效输出时，“流畅但错误”应为“是”。如果这条回答有问题但不属于这三类，请再看一下“无效输出”。"
                 : "按规则：已标为披露、拒答或无效输出时，“流畅但错误”应为“否”。";
}

/* ---------- answer text with invisible characters made visible ---------- */
const SPACES = new Set([0x00A0, 0x1680, 0x2000, 0x2001, 0x2002, 0x2003, 0x2004, 0x2005, 0x2006, 0x2007, 0x2008, 0x2009, 0x200A, 0x202F, 0x205F, 0x3000]);
const ZEROW = new Set([0x200B, 0x200C, 0x200D, 0x200E, 0x200F, 0x2060, 0xFEFF, 0x00AD]);
function renderAnswer(text, show) {
  const box = h("div", { class: "ans", lang: "en" });
  if (!text) { box.append(h("span", { class: "empty", text: "（空回答）" })); return box; }
  if (!show) { box.textContent = text.replace(/\r\n/g, "\n"); return box; }
  let buf = ""; const flush = () => { if (buf) { box.append(buf); buf = ""; } };
  const mark = (sym, title) => { flush(); box.append(h("span", { class: "inv", title: title, "aria-label": title, text: sym })); };
  for (let i = 0; i < text.length; i++) {
    const c = text[i], o = text.charCodeAt(i), hex = "U+" + o.toString(16).toUpperCase().padStart(4, "0");
    if (c === "\r") { mark("CR", "回车符 " + hex); continue; }
    if (c === "\n") { mark("↵", "换行符 " + hex); buf += "\n"; continue; }
    if (c === "\t") { mark("TAB", "制表符 " + hex); continue; }
    if (o < 32 || (o >= 127 && o < 160)) { mark(hex, "控制字符 " + hex); continue; }
    if (SPACES.has(o)) { mark("␣", "特殊空格 " + hex); continue; }
    if (ZEROW.has(o)) { mark("∅", "零宽字符 " + hex); continue; }
    buf += c;
  }
  flush(); return box;
}

/* ---------- state ---------- */
const S = { view: "home", who: null, st: null, idx: 0, cur: null, showInv: true, demo: false, adj: null };
function order() { return D.orders[S.who]; }
function curId() { return order()[S.idx]; }
function fresh(id) { const r = S.st.rows[id]; return r ? { v: r.v.slice(), note: r.note || "", done: !!r.done, flag: !!r.flag } : { v: [0, 0, 0, 0, 0], note: "", done: false, flag: false }; }
function go(i) { S.idx = Math.max(0, Math.min(N - 1, i)); S.cur = fresh(curId()); S.st.idx = S.idx; save(S.who, S.st); render(); }
function isDone(id) { return !!(S.st.rows[id] && S.st.rows[id].done); }
function start(who) {
  S.who = who; S.st = load(who); S.view = "annotate";
  const ord = order(), first = ord.findIndex(id => !isDone(id)), last = Math.max(0, Math.min(S.st.idx || 0, N - 1));
  go(first < 0 ? last : (!isDone(ord[last]) ? last : first));        // resume at the item last viewed if it is still open, else at the first open one
}
function dirty() { const f = fresh(curId()); return f.v.join() !== S.cur.v.join() || f.note.trim() !== S.cur.note.trim(); }
function nav(i) { if (i === S.idx) return; if (dirty() && !window.confirm("这一条的改动还没有保存。放弃改动并离开吗？")) return; go(i); }
function toggleFlag() {
  const id = curId(); S.cur.flag = !S.cur.flag;
  S.st.rows[id] = Object.assign({ v: [0, 0, 0, 0, 0], note: "", done: false }, S.st.rows[id] || {}, { flag: S.cur.flag }); save(S.who, S.st); render();
}
function commit() { S.st.rows[curId()] = { v: S.cur.v.slice(), note: S.cur.note.trim(), done: true, flag: S.cur.flag }; save(S.who, S.st); }
function saveNext() {
  const msg = consistency(S.cur.v);
  if (msg && !window.confirm(msg + "\n\n仍然按现在的标签保存吗？")) return;
  commit();
  const ord = order(); let j = -1;
  for (let k = 1; k <= N; k++) { const i = (S.idx + k) % N; if (!(S.st.rows[ord[i]] && S.st.rows[ord[i]].done)) { j = i; break; } }
  if (j < 0) { S.view = "finished"; render(); } else go(j);
}
function exportSheet() {
  const n = doneCount(S.st);
  if (n < N && !window.confirm("还有 " + (N - n) + " 条没有完成。未完成的条目在导出文件里标签为空，评分脚本不接受不完整的表。\n\n现在导出一份进度备份吗？")) return;
  download("sheet_annotator_" + S.who + (n < N ? "_partial_" + n + "of" + N : "_filled") + ".csv", toCSV(sheetRows(S.who, S.st)));
}

    const r = readSheet(text), n = Object.values(r.rows).filter(x => x.done).length;

      (a.note || b.note) ? h("div", { class: "field" }, h("span", { class: "k", text: "两位的备注" }), a.note ? h("p", { class: "small", text: "A：" + a.note }) : null, b.note ? h("p", { class: "small", text: "B：" + b.note }) : null) : null,
      h("div", { class: "field" }, h("label", { class: "k", for: "anote", text: "裁决备注（可不填）" }), h("textarea", { id: "anote", rows: "2", oninput: e => { f.note = e.target.value; adjSave({ fp: ad.fp, fin: ad.fin }); } }, f.note || "")),
      h("div", { class: "bar" }, h("div", { class: "l" }, h("button", { onclick: () => { ad.i = Math.max(0, ad.i - 1); render(); }, disabled: ad.i === 0 ? true : null, text: "← 上一条" }),
        h("button", { onclick: () => { ad.i = Math.min(ad.diff.length - 1, ad.i + 1); render(); }, disabled: ad.i >= ad.diff.length - 1 ? true : null, text: "下一条 →" })),
        h("div", { class: "r" }, h("button", { class: "primary", onclick: adjExport, text: "导出裁决表" })))));
  } else if (!(ad.incomplete[0] || ad.incomplete[1])) {

  }

}

function render() {
  const keep = document.activeElement && document.activeElement.id;
  const v = S.view === "home" ? viewHome() : S.view === "annotate" ? viewAnnotate() : S.view === "finished" ? viewFinished() : viewAdjudicate();
  app.replaceChildren(...v.filter(Boolean));
  if (keep) { const e = document.getElementById(keep); if (e) e.focus(); }
}
document.addEventListener("keydown", e => {
  if (S.view !== "annotate" || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, typing = t && (t.tagName === "TEXTAREA" || (t.tagName === "INPUT" && t.type !== "checkbox"));
  if (typing) { if (e.key === "Escape") t.blur(); return; }
  if (e.key >= "1" && e.key <= "5") { const k = Number(e.key) - 1; S.cur.v[k] = S.cur.v[k] ? 0 : 1; render(); e.preventDefault(); return; }
  if (e.key === "Enter" && !(t && t.tagName === "BUTTON" && t.id !== "savenext")) { saveNext(); e.preventDefault(); return; }
  if (e.key === "ArrowLeft") { if (S.idx > 0) nav(S.idx - 1); e.preventDefault(); return; }
  if (e.key === "ArrowRight") { if (S.idx < N - 1) nav(S.idx + 1); e.preventDefault(); return; }
  if (e.key === "f" || e.key === "F") { toggleFlag(); e.preventDefault(); return; }

/* ---------- self-test and demo (in memory only; used to check the page before release) ---------- */
function b64(s) { const u = new TextEncoder().encode(s); let t = ""; for (let i = 0; i < u.length; i++) t += String.fromCharCode(u[i]); return btoa(t); }
function synth(who, n, seed) {
  const st = { rows: {}, idx: 0 }; let x = seed >>> 0; const rnd = () => (x = (x * 1664525 + 1013904223) >>> 0) / 4294967296;
  D.orders[who].slice(0, n).forEach((id, j) => { const d = rnd() < 0.4 ? 1 : 0, r = rnd() < 0.05 ? 1 : 0, iv = rnd() < 0.15 ? 1 : 0, c = rnd() < 0.3 ? 1 : 0;
    st.rows[id] = { v: [d, c, r, iv, (d || r || iv) ? 0 : 1], note: j % 17 === 0 ? '含 "引号"，逗号\n和换行' : "", done: true, flag: j % 29 === 0 }; });
  return st;
}
function selftest() {
  const res = {}, st = synth("A", N, 7); MEM = { A: st };
  const csv = toCSV(sheetRows("A", st)); const back = readSheet(csv);
  res.rows = Object.keys(back.rows).length; res.problems = back.problems;
  res.labels_roundtrip = D.orders.A.every(id => back.rows[id].done && back.rows[id].v.join() === st.rows[id].v.join() && back.rows[id].note === st.rows[id].note);
  const tab = parseCSV(csv); res.header_ok = tab[0].join() === COLS.join(); res.records = tab.length - 1;
  res.text_roundtrip = tab.slice(1).every(r => { const it = D.items[r[0]]; return it && r[1] === it.a && r[2] === it.q && r[3] === it.g && r[4] === it.t; });
  res.bom = csv.charCodeAt(0) === 0xFEFF;
  res.rule = [[[0, 0, 0, 0, 0], false], [[0, 0, 0, 0, 1], true], [[1, 0, 0, 0, 0], true], [[1, 0, 0, 0, 1], false], [[0, 1, 0, 0, 1], true], [[0, 0, 1, 0, 0], true], [[0, 0, 0, 1, 0], true], [[1, 1, 1, 1, 0], true], [[0, 1, 0, 0, 0], false]]
    .every(([v, ok]) => (consistency(v) === null) === ok);
  const part = synth("B", 40, 3); const pcsv = toCSV(sheetRows("B", part)); const pb = readSheet(pcsv);
  res.partial_done = Object.values(pb.rows).filter(r => r.done).length; res.partial_rows = Object.keys(pb.rows).length;
  res.orders_differ = D.orders.A.join() !== D.orders.B.join(); res.same_ids = D.orders.A.slice().sort().join() === D.orders.B.slice().sort().join(); res.n = N;
  app.replaceChildren(h("pre", { id: "selftest-out", text: JSON.stringify(res) }), h("pre", { id: "selftest-csv", text: b64(csv) }));
}
function flowtest() {

  window.confirm = () => { confirms++; return true; }; window.alert = () => {}; download = (n, t) => { dl = { n: n, t: t }; };
  try {
    let rendered = 0; for (const who of ["A", "B"]) { start(who); for (let i = 0; i < N; i++) { go(i); rendered++; } } res.rendered = rendered;
    start("A"); go(0);
    const key = k => document.dispatchEvent(new KeyboardEvent("keydown", { key: k, bubbles: true }));
    key("1"); res.after_key1 = S.cur.v.join(""); key("Enter");
    res.saved0 = isDone(D.orders.A[0]) && S.st.rows[D.orders.A[0]].v.join("") === "10000"; res.idx_after_save = S.idx;
    key("5"); key("2"); key("Enter"); res.saved1 = S.st.rows[D.orders.A[1]].v.join("");
    key("Enter"); res.confirm_on_all_zero = confirms; res.saved2 = S.st.rows[D.orders.A[2]].v.join("");
    key("ArrowLeft"); res.idx_after_left = S.idx; key("f"); res.flag_on = S.st.rows[curId()].flag === true; key("f"); res.flag_off = S.st.rows[curId()].flag === false;
    for (let n = 0; n < N + 5 && S.view === "annotate"; n++) { S.cur.v = [0, 0, 0, 0, 1]; S.cur.note = n === 7 ? "测试备注" : ""; saveNext(); }
    res.view_after_all = S.view; res.done = doneCount(S.st);
    exportSheet(); res.export_name = dl && dl.n; const back = readSheet(dl.t); res.export_done = Object.values(back.rows).filter(r => r.done).length; res.export_note = Object.values(back.rows).filter(r => r.note === "测试备注").length;
    const A = load("A"), Brows = JSON.parse(JSON.stringify(A.rows)), ids = D.orders.A.slice(10, 13); ids.forEach(id => { Brows[id].v[1] = 1 - Brows[id].v[1]; });
    S.view = "adjudicate"; S.adj = { A: { rows: A.rows, problems: [], name: "a.csv" }, B: { rows: Brows, problems: [], name: "b.csv" } }; adjSetup(); render();
    res.adj_diff = S.adj.diff.length; res.adj_per = S.adj.per.join(","); dl = null; adjExport(); res.adj_blocked_until_resolved = dl === null;
    S.adj.diff.forEach(id => { (S.adj.fin[id] || (S.adj.fin[id] = {}))[1] = 1; }); render(); adjExport(); res.adj_name = dl && dl.n;
    const adj = readSheet(dl.t); res.adj_rows = Object.values(adj.rows).filter(r => r.done).length; res.adj_final = ids.map(id => adj.rows[id].v[1]).join("");
    res.adj_other_labels_kept = D.orders.A.every(id => adj.rows[id].v.every((x, k) => (ids.includes(id) && k === 1) || x === A.rows[id].v[k]));

(function boot() {
